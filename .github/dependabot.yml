# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
version: 2
updates:
- package-ecosystem: docker-compose
  directories:
  - /capped
  - /dynamicpos/server
  - /speechsearch/server
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: maven
  directories:
  - /background-sync/server
  - /beacon
  - /capped
  - /dynamicpos/server
  - /jwt/server
  - /mnist/java
  - /ngerrorhandler/server
  - /passwordcheck/server
  - /pluggable-fs
  - /poll/server
  - /protobuf
  - /protobuf-js/server
  - /pwmanager/server
  - /pwnd
  - /rss
  - /speechsearch/server
  - /sse
  - /sse-client
  - /sw-push
  - /swagger/server
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch-a:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: maven
  directories:
  - /text2speech/server
  - /twolegged
  - /validation/server
  - /verbalregex
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
